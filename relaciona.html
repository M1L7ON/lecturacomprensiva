<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Relaciona las palabras 🩵</title>
 <link rel="stylesheet" href="relaciona.css">
    
</head>

<body>

    <section class="relaciona">

        <!-- DECORACIONES DEL FONDO -->

        <span class="decoracion corazon-1">♥</span>
        <span class="decoracion corazon-2">♥</span>
        <span class="decoracion estrella-1">✦</span>
        <span class="decoracion estrella-2">✦</span>
        <span class="decoracion corazon-3">♥</span>
        <span class="decoracion corazon-4">♥</span>

        <main class="contenido">

            <!-- ENCABEZADO -->

            <header class="encabezado">

                <h1 class="titulo">
                    <span class="icono-relaciona">🗂️</span>
                    Relaciona
                </h1>

                <p class="subtitulo">
                    Relaciona las palabras con su imagen
                    <br>
                    y demuestra cuánto sabes 💙
                </p>

            </header>

            <!-- LAS TRES ACTIVIDADES -->

            <div class="lista-relaciona">

                <!-- ACTIVIDAD 1 -->

                <article class="relaciona-card">

                    <img
                        src="lobocr.jpeg"
                        alt="El lobo y la zorra astuta"
                        class="imagen-cuento"
                    >

                    <div class="informacion">

                        <h2>El lobo y la zorra astuta</h2>

                        <p>
                            <span class="icono-actividad">▦</span>
                            Relaciona las palabras 
                        </p>

                    </div>

                    <a
                        href="https://es.educaplay.com/recursos-educativos/31005772-el_lobo_y_la_zorra.html"
                        class="flecha"
                        aria-label="Abrir actividad del lobo y la zorra astuta"
                    >➜</a>

                </article>

                <!-- ACTIVIDAD 2 -->

                <article class="relaciona-card">

                    <img
                        src="navisopi.jpeg"
                        alt="Cuentos de Navidad"
                        class="imagen-cuento"
                    >

                    <div class="informacion">

                        <h2>Cuentos de Navidad</h2>

                        <p>
                            <span class="icono-actividad">▦</span>
                            Relaciona las palabras 
                        </p>

                    </div>

                    <a
                        href="https://es.educaplay.com/recursos-educativos/31006318-cuentos_de_navidad.html"
                        class="flecha"
                        aria-label="Abrir actividad de Cuentos de Navidad"
                    >➜</a>

                </article>

                <!-- ACTIVIDAD 3 -->

                <article class="relaciona-card">

                    <img
                        src="mandisopi.jpeg"
                        alt="El mandarín"
                        class="imagen-cuento"
                    >

                    <div class="informacion">

                        <h2>El mandarín</h2>

                        <p>
                            <span class="icono-actividad">▦</span>
                            Relaciona las palabras
                        </p>

                    </div>

                    <a
                                href="https://es.educaplay.com/recursos-educativos/31005806-el_mandarin.html"
                        class="flecha"
                        aria-label="Abrir actividad de El mandarín"
                    >➜</a>

                </article>

            </div>

            <!-- DECORACIÓN INFERIOR -->

            <div class="decoracion-final">
                <span class="linea"></span>
                <span>♥</span>
                <span class="linea"></span>
            </div>

        </main>

    </section>

</body>
</html>|
