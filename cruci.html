<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crucigramas 💜</title>
    <link rel="stylesheet" href="cruci.css">

    
</head>

<body>

    <section class="crucigramas">

        <!-- CORAZONES DECORATIVOS -->

        <span class="corazon corazon-1">♥</span>
        <span class="corazon corazon-2">♥</span>
        <span class="corazon corazon-3">♥</span>
        <span class="corazon corazon-4">♥</span>

        <main class="contenido">

            <!-- ENCABEZADO -->

            <header class="encabezado">

                <h1 class="titulo">
                    <span class="pieza">🧩</span>
                    Crucigramas
                </h1>

                <p class="subtitulo">
                    Pon a prueba tu mente y diviértete
                    <br>
                    con tus cuentos favoritos ♥
                </p>

            </header>

            <!-- LOS TRES CRUCIGRAMAS -->

            <div class="lista-crucigramas">

                <!-- 1. EL LOBO Y LA ZORRA ASTUTA -->

                <article class="crucigrama-card">

                    <img
                        src="lobocr.jpeg"
                        alt="El lobo y la zorra astuta"
                        class="imagen-cuento"
                    >

                    <div class="informacion">

                        <h2>El lobo y la zorra astuta</h2>

                        <p>
                            <span class="icono-calendario">▦</span>
                            Crucigrama del cuento
                        </p>

                    </div>

                    <a
                        href="https://es.educaplay.com/recursos-educativos/31005650-el_lobo_y_la_zorra_astuta.html"
                        class="flecha"
                        aria-label="Abrir el crucigrama del lobo y la zorra astuta"
                    >➜</a>

                </article>

                <!-- 2. CUENTOS DE NAVIDAD -->

                <article class="crucigrama-card">

                    <img
                        src="navisopi.jpeg"
                        alt="Cuentos de Navidad"
                        class="imagen-cuento"
                    >

                    <div class="informacion">

                        <h2>Cuentos de Navidad</h2>

                        <p>
                            <span class="icono-calendario">▦</span>
                            Crucigrama navideño
                        </p>

                    </div>

                    <a
                        href="https://es.educaplay.com/recursos-educativos/31005695-cuentos_de_navidad.html"
                        class="flecha"
                        aria-label="Abrir el crucigrama de Cuentos de Navidad"
                    >➜</a>

                </article>

                <!-- 3. EL MANDARÍN -->

                <article class="crucigrama-card">

                    <img
                        src="mandisopi.jpeg"
                        alt="El mandarín"
                        class="imagen-cuento"
                    >

                    <div class="informacion">

                        <h2>El mandarín</h2>

                        <p>
                            <span class="icono-calendario">▦</span>
                            Crucigrama del cuento
                        </p>

                    </div>

                    <a
                        href="https://es.educaplay.com/recursos-educativos/31005735-crucigrama_sobre_el_mandarin.html"
                        class="flecha"
                        aria-label="Abrir el crucigrama de El mandarín"
                    >➜</a>

                </article>

            </div>

            <!-- DECORACIÓN FINAL -->

            <div class="decoracion-final">
                <span class="linea"></span>
                <span>♥</span>
                <span class="linea"></span>
            </div>

        </main>

    </section>

</body>
</html>
