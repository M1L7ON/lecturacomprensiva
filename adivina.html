<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adivina la palabra 💗</title>
     <link rel="stylesheet" href="adivina.css">
</head>

<body>

    <section class="adivina">

        <!-- DECORACIONES -->

        <span class="decoracion corazon-1">♥</span>
        <span class="decoracion corazon-2">♥</span>
        <span class="decoracion estrella-1">✦</span>
        <span class="decoracion estrella-2">✦</span>
        <span class="decoracion corazon-3">♥</span>
        <span class="decoracion corazon-4">♥</span>

        <main class="contenido">

            <!-- ENCABEZADO -->

            <header class="encabezado">

                <h1 class="titulo">
                    <span class="icono-titulo">💡</span>
                    Adivina la palabra
                </h1>

                <p class="subtitulo">
                    Observa la imagen, piensa y adivina

                    la palabra correcta ♥
                </p>

            </header>

            <!-- LISTA DE LOS TRES CUENTOS -->

            <div class="lista-cuentos">

                <!-- 1. ROMEO Y JULIETA -->

                <article class="cuento-card">

                    <img
                        src="vide1.jpeg"
                        alt="Ilustración de Romeo y Julieta"
                        class="imagen-cuento"
                    >

                    <div class="informacion">

                        <h2>Romeo y Julieta</h2>

                        <p>
                            <span class="icono-actividad">▦</span>
                            Adivina la palabra del cuento
                        </p>

                    </div>

                    <a
                        href="https://es.educaplay.com/recursos-educativos/31005842-romeo.html"
                        class="flecha"
                        aria-label="Abrir actividad de Romeo y Julieta"
                    >➜</a>

                </article>

                <!-- 2. EL PRINCIPITO -->

                <article class="cuento-card">

                    <img
                        src="vide8.jpeg"
                        alt="Ilustración de El principito"
                        class="imagen-cuento"
                    >

                    <div class="informacion">

                        <h2>El principito</h2>

                        <p>
                            <span class="icono-actividad">▦</span>
                            Adivina la palabra del cuento
                        </p>

                    </div>

                    <a
                        href="https://es.educaplay.com/recursos-educativos/31005890-adivinanzas_sobre_el_principito.html"
                        class="flecha"
                        aria-label="Abrir actividad de El principito"
                    >➜</a>

                </article>

                <!-- 3. CUENTOS DE NAVIDAD -->

                <article class="cuento-card">

                    <img
                        src="navisopi.jpeg"

                        class="imagen-cuento"
                    >

                    <div class="informacion">

                        <h2>Cuentos de Navidad</h2>

                        <p>
                            <span class="icono-actividad">▦</span>
                            Adivina la palabra del cuento
                        </p>

                    </div>

                    <a
                        href="https://es.educaplay.com/recursos-educativos/31005898-cuentos_de_navidad.html"
                        class="flecha"
                        aria-label="Abrir actividad de Cuentos de Navidad"
                    >➜</a>

                </article>

            </div>

            <!-- DECORACIÓN FINAL -->

            <div class="decoracion-final">
                <span class="linea"></span>
                <span>♥</span>
                <span class="linea"></span>
            </div>
